<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid Lines -->
  <g stroke="rgba(255,255,255,0.12)" stroke-width="2">
    <line x1="64" y1="0" x2="64" y2="512" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="192" y1="0" x2="192" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="320" y1="0" x2="320" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="448" y1="0" x2="448" y2="512" />

    <line x1="0" y1="64" x2="512" y2="64" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="192" x2="512" y2="192" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="320" x2="512" y2="320" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="0" y1="448" x2="512" y2="448" />
  </g>

  <!-- Calculator Screen Device Frame -->
  <g filter="url(#shadow)">
    <rect x="80" y="70" width="352" height="110" rx="16" fill="url(#screenGrad)" stroke="#334155" stroke-width="4" />
    <!-- Architectural readout -->
    <text x="410" y="112" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="end">8 ft 6 3/8 in</text>
    <text x="410" y="156" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="34" font-weight="700" text-anchor="end">= 102.375 in</text>
  </g>

  <!-- Architectural Compass & Ruler Emblem -->
  <g transform="translate(256, 335)" filter="url(#shadow)">
    <!-- Drafting Triangle / Set Square Base -->
    <path d="M-130,85 L0,-115 L130,85 Z" fill="rgba(255,255,255,0.92)" />
    <path d="M-65,65 L0,-35 L65,65 Z" fill="#ea580c" />

    <!-- Ruler tick marks along bottom edge -->
    <g stroke="#334155" stroke-width="3">
      <line x1="-110" y1="85" x2="-110" y2="65" />
      <line x1="-90" y1="85" x2="-90" y2="73" />
      <line x1="-70" y1="85" x2="-70" y2="65" />
      <line x1="-50" y1="85" x2="-50" y2="73" />
      <line x1="-30" y1="85" x2="-30" y2="65" />
      <line x1="-10" y1="85" x2="-10" y2="73" />
      <line x1="10" y1="85" x2="10" y2="73" />
      <line x1="30" y1="85" x2="30" y2="65" />
      <line x1="50" y1="85" x2="50" y2="73" />
      <line x1="70" y1="85" x2="70" y2="65" />
      <line x1="90" y1="85" x2="90" y2="73" />
      <line x1="110" y1="85" x2="110" y2="65" />
    </g>

    <!-- Compass Pivot Top -->
    <circle cx="0" cy="-115" r="16" fill="#0f172a" stroke="#ffffff" stroke-width="4" />
    <circle cx="0" cy="-115" r="6" fill="#38bdf8" />
  </g>
</svg>
